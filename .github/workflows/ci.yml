name: CLUE Curriculum CI
on: push
jobs:
  s3-deploy:
      name: S3 Deploy
      runs-on: ubuntu-latest
      permissions:
        id-token: write
        contents: read
        deployments: write
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v7
        - name: Use Node.js
          uses: actions/setup-node@v7
          with:
            node-version: "24"
        - name: Install Dependencies
          run: npm ci
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
            role-to-assume: arn:aws:iam::612297603577:role/clue-curriculum
            aws-region: us-east-1
        - name: Deploy
          uses: concord-consortium/s3-deploy-action@v1
          with:
            bucket: models-resources
            folderToDeploy: curriculum
            prefix: clue-curriculum
            githubToken: ${{ secrets.GITHUB_TOKEN }}
            deployRunUrl: https://models-resources.concord.org/clue-curriculum/__deployPath__/
            # Parameters to GHActions have to be strings, so a regular yaml array cannot
            # be used. Instead the `|` turns the following lines into a string
            topBranches: |
              ["main"]
